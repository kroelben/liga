<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnes Fodboldliga</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  #app { max-width: 960px; margin: 0 auto; padding: 28px 20px; }

  /* ── Header ── */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .league-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, #e8c84a, #b89a2a);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .league-title { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
  .league-sub { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .reset-btn {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid #2a2a3a;
    color: #555;
    font-size: 11px; font-family: inherit;
    border-radius: 4px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.5px;
    transition: border-color 0.15s, color 0.15s;
  }
  .reset-btn:hover { border-color: #e8c84a; color: #e8c84a; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .simulate-btn {
    padding: 10px 20px;
    background: #e8c84a;
    border: none;
    color: #000;
    font-size: 12px; font-family: inherit; font-weight: 700;
    border-radius: 4px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.5px;
    transition: background 0.15s;
  }
  .simulate-btn:hover:not(:disabled) { background: #f0d55a; }
  .simulate-btn:disabled { background: #1e1e2a; color: #444; cursor: default; }

  /* ── Tabs ── */
  .tabs { display: flex; border-bottom: 1px solid #1e1e2a; margin-bottom: 28px; }
  .tab {
    padding: 10px 22px;
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: #444; cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s;
    user-select: none;
  }
  .tab.active { color: #e8c84a; border-bottom-color: #e8c84a; }
  .tab:hover:not(.active) { color: #888; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Shared ── */
  .section-label {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 1.5px; color: #444; margin-bottom: 12px;
  }
  .team-logo {
    width: 24px; height: 24px;
    border-radius: 50%; object-fit: contain;

  }
  .team-cell { display: flex; align-items: center; gap: 10px; }
  .team-name { color: #ddd; font-weight: 500; }

  /* ── Standings ── */
  .standings-table { width: 100%; border-collapse: collapse; }
  .standings-table thead tr { border-bottom: 1px solid #1e1e2a; }
  .standings-table thead th {
    padding: 6px 8px; font-size: 10px;

    color: #444; font-weight: 600;
    text-align: center; white-space: nowrap;
  }

  .standings-table tbody tr:hover { background: #13131c; }
  .standings-table tbody td { padding: 9px 8px; text-align: center; color: #888; white-space: nowrap; }
  .standings-table tbody td.col-team { text-align: left; }

  .zone-el td:first-child { border-left: 2px solid #4a8fff; }
  .zone-rel td:first-child { border-left: 2px solid #ff5252; }
  .zone-none td:first-child { border-left: 2px solid transparent; }
  .rank-badge {

  .rank-el { background: #1a1f2e; color: #4a8fff; }
  .rank-rel { background: #2e1a1a; color: #ff5252; }
  .rank-none { background: #1a1a22; color: #555; }
  .pts-cl { font-weight: 700; color: #e8c84a; }
  .pts-el { font-weight: 700; color: #aaa; }
  .pts-mid { font-weight: 600; color: #666; }
  .pts-rel { font-weight: 700; color: #ff5252; }
  .form-cell { display: flex; gap: 3px; justify-content: center; }

  .form-D { background: #22221a; color: #888; }
  .form-L { background: #2e1a1a; color: #ff5252; }

  .fixture-vs { font-size: 11px; color: #444; min-width: 24px; text-align: center; font-weight: 700; }

<script>

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function loadTeams() {
  const res = await fetch('./teams.json');
  const teams = await res.json();
  return teams.map(t => ({
    id: t.id,
    name: t.name,
    logoFile: `${t.id}.png`,
    strength: Math.floor(Math.random() * 10) + 1,
    played: 0, won: 0, drawn: 0, lost: 0,
    gf: 0, ga: 0, points: 0
  }));
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateFixtures(teams) {
  const ids = shuffle([...teams]).map(t => t.id);
  const n = ids.length; // 20
  const rotate = ids.slice(1);
  const firstHalf = [];

  for (let round = 0; round < n - 1; round++) {
    const circle = [ids[0], ...rotate];
    for (let i = 0; i < n / 2; i++) {
      firstHalf.push({ matchday: round + 1, homeId: circle[i], awayId: circle[n - 1 - i] });
    }
    rotate.unshift(rotate.pop());
  }

  const secondHalf = firstHalf.map(f => ({
    matchday: f.matchday + (n - 1),
    homeId: f.awayId,
    awayId: f.homeId
  }));

  const all = [...firstHalf, ...secondHalf];
  const byMatchday = {};
  for (const f of all) {
    (byMatchday[f.matchday] ??= []).push(f);
  }
  return Object.values(byMatchday).flatMap(matches => shuffle(matches));
}

function strToSeed(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++)
    h = Math.imul(h ^ str.charCodeAt(i), 2654435761);
  return h >>> 0;
}

function makeRng(seed) {
  let s = seed;
  return () => { s = Math.imul(s, 1664525) + 1013904223; return (s >>> 0) / 4294967296; };
}

function generateScorers(teams) {
  const scorers = [];
  for (const team of teams) {
    const rng = makeRng(strToSeed(team.id));
    const count = 2 + Math.floor(rng() * 2); // 2 or 3
    for (let i = 0; i < count; i++) {
      const first = FIRST_NAMES[Math.floor(rng() * FIRST_NAMES.length)];
      const last  = LAST_NAMES[Math.floor(rng() * LAST_NAMES.length)];
      scorers.push({ name: `${first} ${last}`, teamId: team.id, goals: 0, assists: 0 });
    }
  }
  return scorers;
}

async function saveState() {
  localStorage.setItem('magnes-liga', JSON.stringify(state));
}

async function init() {
  const saved = localStorage.getItem('magnes-liga');
  if (saved) {
    try {
      state = JSON.parse(saved);
      state.scorers = state.scorers.map(s => ({ assists: 0, ...s }));
    } catch {
      localStorage.removeItem('magnes-liga');
      const teams = await loadTeams();
      state = {
        teams,
        fixtures: generateFixtures(teams),
        results: [],
        scorers: generateScorers(teams),
        currentMatchday: 0
      };
      await saveState();
    }
  } else {
    const teams = await loadTeams();
    state = {
      teams,
      fixtures: generateFixtures(teams),
      results: [],
      scorers: generateScorers(teams),
      currentMatchday: 0
    };
    await saveState();
  }
  render();
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(el =>
    el.classList.toggle('active', el.dataset.tab === tab)
  );
  document.querySelectorAll('.tab-content').forEach(el =>
    el.classList.toggle('active', el.id === `tab-${tab}`)
  );
  render();
}

function render() {
  document.getElementById('league-sub').textContent =
    state.currentMatchday > 0
      ? `Sæson 1 · Runde ${state.currentMatchday} af 38`
      : 'Sæson 1 · Før sæsonen';
  const simBtn = document.getElementById('simulate-btn');
  if (simBtn) {
    if (mdState) {
      simBtn.textContent = `Fortsæt runde ${state.currentMatchday}`;
      simBtn.disabled = false;
    } else {
      const next = state.currentMatchday + 1;
      simBtn.textContent = next <= 38 ? `Simuler runde ${next}` : 'Sæson afsluttet';
      simBtn.disabled = state.currentMatchday >= 38;
    }
  }
  if      (activeTab === 'stilling')  renderStandings();
  else if (activeTab === 'hjemme')    renderHjemme();
  else if (activeTab === 'ude')       renderUde();
  else if (activeTab === 'form')      renderForm();
  else if (activeTab === 'kampe')     renderKampe();
  else if (activeTab === 'statistik') renderStats();
}

function getZone(rank) {
  if (rank <= 4) return 'cl';
  if (rank <= 6) return 'el';
  if (rank >= 18) return 'rel';
  return 'none';
}

function getForm(teamId) {
  return state.results
    .filter(r => r.homeId === teamId || r.awayId === teamId)
    .sort((a, b) => b.matchday - a.matchday)
    .slice(0, 5)
    .map(r => {
      const isHome = r.homeId === teamId;
      const scored = isHome ? r.homeGoals : r.awayGoals;
      const conceded = isHome ? r.awayGoals : r.homeGoals;
      if (scored > conceded) return 'W';
      if (scored < conceded) return 'L';
      return 'D';
    })
    .reverse();
}

function renderFormBadges(teamId) {
  const form = getForm(teamId);
  let html = '';
  for (let i = 0; i < 5; i++) {
    const r = form[i];
    html += r
      ? `<span class="form-badge form-${r}">${r}</span>`
      : `<span class="form-badge form-empty">·</span>`;
  }
  return `<div class="form-cell">${html}</div>`;
}

function standingsTableHTML(rankedTeams, showForm) {
  const rows = rankedTeams.map((team, i) => {
    const rank = i + 1;
    const zone = getZone(rank);
    const gd = team.gf - team.ga;
    const gdStr = gd > 0 ? `+${gd}` : `${gd}`;
    const ptsClass = { cl: 'pts-cl', el: 'pts-el', rel: 'pts-rel', none: 'pts-mid' }[zone];
    const maal = `${team.gf} - ${team.ga}`;
    const formCell = showForm
      ? `<td>${renderFormBadges(team.id)}</td>`
      : `<td></td>`;
    return `
      <tr class="zone-${zone}">
        <td><span class="rank-badge rank-${zone}">${rank}</span></td>
        <td class="col-team">
          <div class="team-cell">
            <img class="team-logo" src="./logos/${team.logoFile}" alt="${esc(team.name)}">
            <span class="team-name">${esc(team.name)}</span>
          </div>
        </td>
        <td>${team.played}</td>
        <td>${team.won}</td>
        <td>${team.drawn}</td>
        <td>${team.lost}</td>
        <td>${maal}</td>
        <td>${gdStr}</td>
        ${formCell}
        <td class="${ptsClass}">${team.points}</td>
      </tr>`;
  }).join('');

  return `
    <table class="standings-table">
      <thead>
        <tr>
          <th style="width:32px;">#</th>
          <th class="col-team">Hold</th>
          <th>K</th><th>V</th><th>U</th><th>T</th>
          <th>MÅL</th><th>DIFF</th>
          <th>Form</th>
          <th>P</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderStandings() {
  const sorted = [...state.teams].sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    const gdDiff = (b.gf - b.ga) - (a.gf - a.ga);
    if (gdDiff !== 0) return gdDiff;
    if (b.gf !== a.gf) return b.gf - a.gf;
    return a.name.localeCompare(b.name);
  });

  document.getElementById('tab-stilling').innerHTML = `
    <div class="section-label">
      ${state.currentMatchday > 0 ? `Runde ${state.currentMatchday} af 38` : 'Før sæsonen'}
    </div>
    ${standingsTableHTML(sorted, true)}
    <div class="standings-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#4caf50"></div>Champions League (1–4)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#4a8fff"></div>Europa League (5–6)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff5252"></div>Nedrykning (18–20)</div>
    </div>`;
}

function renderStats() {
  const sorted = [...state.scorers].sort((a, b) => b.goals - a.goals);
  const rows = sorted.map((scorer, i) => {
    const team = state.teams.find(t => t.id === scorer.teamId) ?? { logoFile: '', name: 'Unknown' };
    return `
      <tr>
        <td>${i + 1}</td>
        <td class="col-player">${esc(scorer.name)}</td>
        <td class="col-player">
          <div class="team-cell">
            <img class="team-logo" src="./logos/${team.logoFile}" alt="${esc(team.name)}">
            <span style="color:#888;font-size:12px;">${esc(team.name)}</span>
          </div>
        </td>
        <td class="goals-cell">${scorer.goals}</td>
      </tr>`;
  }).join('');

  document.getElementById('tab-statistik').innerHTML = `
    <div class="section-label">Topscorere</div>
    <table class="stats-table">
      <thead>
        <tr>
          <th style="width:32px;">#</th>
          <th class="col-player">Spiller</th>
          <th class="col-player">Klub</th>
          <th>Mål</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderResults() {
  if (state.results.length === 0) {
    document.getElementById('tab-results').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <p>Ingen resultater endnu. Simuler en runde for at se resultater her.</p>
      </div>`;
    return;
  }

  const matchdays = [...new Set(state.results.map(r => r.matchday))].sort((a, b) => b - a);
  const latest = matchdays[0];

  function buildResultsHTML(matchday) {
    const matches = state.results.filter(r => r.matchday === matchday);
    return `<div class="results-grid">${matches.map(r => {
      const home = state.teams.find(t => t.id === r.homeId) ?? { logoFile: '', name: 'Unknown' };
      const away = state.teams.find(t => t.id === r.awayId) ?? { logoFile: '', name: 'Unknown' };
      return `
        <div class="result-card">
          <div class="result-team">
            <img class="team-logo" src="./logos/${home.logoFile}" alt="${esc(home.name)}">
            <span class="result-team-name">${esc(home.name)}</span>
          </div>
          <span class="result-score">${r.homeGoals}–${r.awayGoals}</span>
          <div class="result-team away">
            <img class="team-logo" src="./logos/${away.logoFile}" alt="${esc(away.name)}">
            <span class="result-team-name">${esc(away.name)}</span>
          </div>
        </div>`;
    }).join('')}</div>`;
  }

  const options = matchdays.map(md =>
    `<option value="${md}" ${md === latest ? 'selected' : ''}>Runde ${md}</option>`
  ).join('');

  document.getElementById('tab-results').innerHTML = `
    <div class="results-controls">
      <div class="section-label" style="margin:0">Runde</div>
      <select class="matchday-select" id="results-select" onchange="updateResultsMatchday(this.value)">
        ${options}
      </select>
    </div>
    <div id="results-content">${buildResultsHTML(latest)}</div>`;

  window.updateResultsMatchday = md => {
    document.getElementById('results-content').innerHTML = buildResultsHTML(Number(md));
  };
}

function renderFixtures() {
  const allMatchdays = [...new Set(state.fixtures.map(f => f.matchday))].sort((a, b) => a - b);
  const nextUnplayed = allMatchdays.find(md => md > state.currentMatchday) ?? allMatchdays[allMatchdays.length - 1];

  function buildMatchdayHTML(matchday) {
    const matches = state.fixtures.filter(f => f.matchday === matchday);
    const isPast = matchday <= state.currentMatchday;
    return `<div class="fixtures-grid">${matches.map(f => {
      const home = state.teams.find(t => t.id === f.homeId) ?? { logoFile: '', name: 'Unknown' };
      const away = state.teams.find(t => t.id === f.awayId) ?? { logoFile: '', name: 'Unknown' };
      return `
        <div class="fixture-card" style="${isPast ? 'opacity:0.45;' : ''}">
          <div class="fixture-team">
            <img class="team-logo" src="./logos/${home.logoFile}" alt="${esc(home.name)}">
            <span class="fixture-team-name">${esc(home.name)}</span>
          </div>
          <span class="fixture-vs">vs</span>
          <div class="fixture-team away">
            <img class="team-logo" src="./logos/${away.logoFile}" alt="${esc(away.name)}">
            <span class="fixture-team-name">${esc(away.name)}</span>
          </div>
        </div>`;
    }).join('')}</div>`;
  }

  const options = allMatchdays.map(md =>
    `<option value="${md}" ${md === nextUnplayed ? 'selected' : ''}>Runde ${md}</option>`
  ).join('');

  document.getElementById('tab-fixtures').innerHTML = `
    <div class="fixtures-controls">
      <div class="section-label" style="margin:0">Runde</div>
      <select class="matchday-select" id="fixture-select" onchange="updateFixtureMatchday(this.value)">
        ${options}
      </select>
    </div>
    <div id="fixture-content">${buildMatchdayHTML(nextUnplayed)}</div>`;

  window.updateFixtureMatchday = md => {
    document.getElementById('fixture-content').innerHTML = buildMatchdayHTML(Number(md));
  };
}

function computeGoals(attackStr, defStr, isHome) {
  const base = (attackStr / (attackStr + defStr)) * (isHome ? 2.2 : 1.8);
  const raw = Math.floor(base + Math.random() * 3);
  return Math.min(5, Math.max(0, raw));
}

function randomScorer(teamId) {
  const pool = state.scorers.filter(s => s.teamId === teamId);
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)].name;
}

function randomScorerExcluding(teamId, excludeName) {
  const pool = state.scorers.filter(s => s.teamId === teamId && s.name !== excludeName);
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)].name;
}

function generateEvents(fixture, homeGoals, awayGoals) {
  const events = [];
  const usedMinutes = new Set();
  function randMinute() {
    let m;
    do { m = 1 + Math.floor(Math.random() * 90); } while (usedMinutes.has(m));
    usedMinutes.add(m);
    return m;
  }
  for (let i = 0; i < homeGoals; i++) {
    const scorer = randomScorer(fixture.homeId);
    const assist = Math.random() < 0.75 ? randomScorerExcluding(fixture.homeId, scorer) : null;
    events.push({ minute: randMinute(), type: 'goal', teamId: fixture.homeId, playerName: scorer, assist });
  }
  for (let i = 0; i < awayGoals; i++) {
    const scorer = randomScorer(fixture.awayId);
    const assist = Math.random() < 0.75 ? randomScorerExcluding(fixture.awayId, scorer) : null;
    events.push({ minute: randMinute(), type: 'goal', teamId: fixture.awayId, playerName: scorer, assist });
  }
  const chanceCount = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < chanceCount; i++)
    events.push({ minute: randMinute(), type: 'chance', teamId: Math.random() < 0.5 ? fixture.homeId : fixture.awayId, playerName: null });
  const cardCount = Math.floor(Math.random() * 3);
  for (let i = 0; i < cardCount; i++) {
    const cardTeam = Math.random() < 0.5 ? fixture.homeId : fixture.awayId;
    events.push({ minute: randMinute(), type: 'yellow', teamId: cardTeam, playerName: randomScorer(cardTeam) });
  }
  return events.sort((a, b) => a.minute - b.minute);
}

function applyResult(fixture, homeGoals, awayGoals, events) {
  const home = state.teams.find(t => t.id === fixture.homeId);
  const away = state.teams.find(t => t.id === fixture.awayId);
  home.played++; away.played++;
  home.gf += homeGoals; home.ga += awayGoals;
  away.gf += awayGoals; away.ga += homeGoals;
  if (homeGoals > awayGoals) { home.won++; home.points += 3; away.lost++; }
  else if (homeGoals < awayGoals) { away.won++; away.points += 3; home.lost++; }
  else { home.drawn++; home.points++; away.drawn++; away.points++; }
  for (const ev of events) {
    if (ev.type === 'goal' && ev.playerName) {
      const scorer = state.scorers.find(s => s.teamId === ev.teamId && s.name === ev.playerName);
      if (scorer) scorer.goals++;
    }
    if (ev.type === 'goal' && ev.assist) {
      const assister = state.scorers.find(s => s.teamId === ev.teamId && s.name === ev.assist);
      if (assister) assister.assists++;
    }
  }
  state.results.push({ matchday: fixture.matchday, homeId: fixture.homeId, awayId: fixture.awayId, homeGoals, awayGoals });
}

async function simulateMatchday() {
  if (mdState) { mdResume(); return; }
  const nextMatchday = state.currentMatchday + 1;
  if (nextMatchday > 38) return;
  state.currentMatchday = nextMatchday;
  const fixtures = state.fixtures.filter(f => f.matchday === nextMatchday);
  const matchResults = [];
  for (const fixture of fixtures) {
    const home = state.teams.find(t => t.id === fixture.homeId);
    const away = state.teams.find(t => t.id === fixture.awayId);
    const homeGoals = computeGoals(home.strength, away.strength, true);
    const awayGoals = computeGoals(away.strength, home.strength, false);
    const events = generateEvents(fixture, homeGoals, awayGoals);
    applyResult(fixture, homeGoals, awayGoals, events);
    matchResults.push({ fixture, homeGoals, awayGoals, events });
  }
  await saveState();
  render();
  openMatchdayModal(matchResults);
}

let mdState = null;

function openMatchdayModal(matchResults) {
  mdState = { matchResults, matchIndex: 0, eventTimer: null, pendingKickoff: true };
  const simBtn = document.getElementById('simulate-btn');
  if (simBtn) simBtn.disabled = true;
  document.getElementById('md-modal').style.display = 'flex';
  showMatch(0);
}

function showMatch(index) {
  const { matchResults } = mdState;
  const { fixture } = matchResults[index];
  const home = state.teams.find(t => t.id === fixture.homeId);
  const away = state.teams.find(t => t.id === fixture.awayId);
  document.getElementById('md-header').textContent =
    `Runde ${state.currentMatchday} · ${index + 1}/${matchResults.length}`;
  document.getElementById('md-home-shirt').src = `/shirts/${fixture.homeId}.png`;
  document.getElementById('md-home-shirt').alt = home.name;
  document.getElementById('md-away-shirt').src = `/shirts/${fixture.awayId}.png`;
  document.getElementById('md-away-shirt').alt = away.name;
  document.getElementById('md-home-name').textContent = home.name;
  document.getElementById('md-away-name').textContent = away.name;
  document.getElementById('md-home-score').textContent = '0';
  document.getElementById('md-away-score').textContent = '0';
  mdClearEvent();
  document.getElementById('md-skip-btn').style.display = 'none';
  document.getElementById('md-primary-btn').textContent = 'Spark af →';
  document.getElementById('md-primary-btn').disabled = false;
  mdState.matchIndex = index;
  mdState.pendingKickoff = true;
}

function mdPrimaryAction() {
  if (mdState.pendingKickoff) {
    mdState.pendingKickoff = false;
    document.getElementById('md-primary-btn').disabled = true;
    document.getElementById('md-skip-btn').style.display = 'block';
    playEvents(mdState.matchResults[mdState.matchIndex].events,
               mdState.matchResults[mdState.matchIndex].fixture);
  } else {
    const next = mdState.matchIndex + 1;
    if (next < mdState.matchResults.length) {
      showMatch(next);
    } else {
      mdClose();
    }
  }
}

function playEvents(events, fixture) {
  let homeScore = 0, awayScore = 0, i = 0;
  function tick() {
    if (!mdState) return;
    if (i >= events.length) {
      document.getElementById('md-skip-btn').style.display = 'none';
      const isLast = mdState.matchIndex + 1 >= mdState.matchResults.length;
      document.getElementById('md-primary-btn').textContent = isLast ? 'Luk' : 'Næste kamp →';
      document.getElementById('md-primary-btn').disabled = false;
      mdState.eventTimer = null;
      return;
    }
    const ev = events[i++];
    if (ev.type === 'goal') {
      if (ev.teamId === fixture.homeId) {
        homeScore++;
        document.getElementById('md-home-score').textContent = homeScore;
      } else {
        awayScore++;
        document.getElementById('md-away-score').textContent = awayScore;
      }
      mdShowEvent('⚽', 'MÅL!', ev.playerName ? `${ev.playerName} · ${ev.minute}'` : `${ev.minute}'`);
    } else if (ev.type === 'chance') {
      mdShowEvent('💨', 'Stor chance!', `${ev.minute}'`);
    } else if (ev.type === 'yellow') {
      mdShowEvent('💛', 'Gult kort', ev.playerName ? `${ev.playerName} · ${ev.minute}'` : `${ev.minute}'`);
    }
    mdState.eventTimer = setTimeout(tick, 600);
  }
  tick();
}

function mdSkip() {
  if (mdState.eventTimer) { clearTimeout(mdState.eventTimer); mdState.eventTimer = null; }
  const { fixture, homeGoals, awayGoals } = mdState.matchResults[mdState.matchIndex];
  document.getElementById('md-home-score').textContent = homeGoals;
  document.getElementById('md-away-score').textContent = awayGoals;
  mdClearEvent();
  document.getElementById('md-skip-btn').style.display = 'none';
  const isLast = mdState.matchIndex + 1 >= mdState.matchResults.length;
  document.getElementById('md-primary-btn').textContent = isLast ? 'Luk' : 'Næste kamp →';
  document.getElementById('md-primary-btn').disabled = false;
}

function mdShowEvent(icon, label, detail) {
  document.getElementById('md-event-icon').textContent = icon;
  document.getElementById('md-event-label').textContent = label;
  document.getElementById('md-event-detail').textContent = detail;
}

function mdClearEvent() {
  document.getElementById('md-event-icon').textContent = '';
  document.getElementById('md-event-label').textContent = '';
  document.getElementById('md-event-detail').textContent = '';
}

function mdClose() {
  if (mdState && mdState.eventTimer) clearTimeout(mdState.eventTimer);
  mdState = null;
  document.getElementById('md-modal').style.display = 'none';
  render();
}

function mdDismiss() {
  if (!mdState) return;
  if (mdState.eventTimer) mdSkip();
  document.getElementById('md-modal').style.display = 'none';
  render();
}

function mdResume() {
  if (!mdState) return;
  document.getElementById('md-modal').style.display = 'flex';
  render();
}

async function resetLeague() {
  if (mdState) mdClose();
  if (!confirm('Nulstil ligaen? Al fremgang slettes.')) return;
  try {
    const teams = await loadTeams();
    state = {
      teams,
      fixtures: generateFixtures(teams),
      results: [],
      scorers: generateScorers(teams),
      currentMatchday: 0
    };
    await saveState();
    render();
  } catch (err) {
    console.error('Reset failed:', err);
    alert('Reset failed.');
  }
}

document.addEventListener('DOMContentLoaded', () =>
  init().catch(err => {
    document.getElementById('league-sub').textContent = 'Failed to load';
    console.error('Init failed:', err);
  })
);
</script>

        <img id="md-home-shirt" class="md-shirt" src="" alt="">
        <span id="md-home-name" class="md-team-name"></span>
        <span id="md-home-score" class="md-score">0</span>

      </div>

    <div id="md-event-zone">
