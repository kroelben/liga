<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnes Fodboldliga</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  #app { max-width: 960px; margin: 0 auto; padding: 28px 20px; }

  /* ── Header ── */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .league-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, #e8c84a, #b89a2a);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .league-title { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
  .league-sub { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .reset-btn {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid #2a2a3a;
    color: #555;
    font-size: 11px; font-family: inherit;
    border-radius: 4px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.5px;
    transition: border-color 0.15s, color 0.15s;
  }
  .reset-btn:hover { border-color: #e8c84a; color: #e8c84a; }

  /* ── Tabs ── */
  .tabs { display: flex; border-bottom: 1px solid #1e1e2a; margin-bottom: 28px; }
  .tab {
    padding: 10px 22px;
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: #444; cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s;
    user-select: none;
  }
  .tab.active { color: #e8c84a; border-bottom-color: #e8c84a; }
  .tab:hover:not(.active) { color: #888; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Shared ── */
  .section-label {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 1.5px; color: #444; margin-bottom: 12px;
  }
  .team-logo {
    width: 24px; height: 24px;
    border-radius: 50%; object-fit: contain;
    background: #1a1a22; border: 1px solid #2a2a3a; flex-shrink: 0;
  }
  .team-cell { display: flex; align-items: center; gap: 10px; }
  .team-name { color: #ddd; font-weight: 500; }

  /* ── Standings ── */
  .standings-table { width: 100%; border-collapse: collapse; }
  .standings-table thead tr { border-bottom: 1px solid #1e1e2a; }
  .standings-table thead th {
    padding: 6px 8px; font-size: 10px;
    text-transform: uppercase; letter-spacing: 1px;
    color: #444; font-weight: 600;
    text-align: center; white-space: nowrap;
  }
  .standings-table thead th.col-team { text-align: left; }
  .standings-table tbody tr { border-bottom: 1px solid #0f0f18; transition: background 0.1s; }
  .standings-table tbody tr:hover { background: #13131c; }
  .standings-table tbody td { padding: 9px 8px; text-align: center; color: #888; white-space: nowrap; }
  .standings-table tbody td.col-team { text-align: left; }
  .zone-cl td:first-child { border-left: 2px solid #4caf50; }
  .zone-el td:first-child { border-left: 2px solid #4a8fff; }
  .zone-rel td:first-child { border-left: 2px solid #ff5252; }
  .zone-none td:first-child { border-left: 2px solid transparent; }
  .rank-badge {
    width: 20px; height: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; border-radius: 3px;
  }
  .rank-cl { background: #1a2e1a; color: #4caf50; }
  .rank-el { background: #1a1f2e; color: #4a8fff; }
  .rank-rel { background: #2e1a1a; color: #ff5252; }
  .rank-none { background: #1a1a22; color: #555; }
  .pts-cl { font-weight: 700; color: #e8c84a; }
  .pts-el { font-weight: 700; color: #aaa; }
  .pts-mid { font-weight: 600; color: #666; }
  .pts-rel { font-weight: 700; color: #ff5252; }
  .form-cell { display: flex; gap: 3px; justify-content: center; }
  .form-badge {
    width: 16px; height: 16px; border-radius: 2px;
    font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .form-W { background: #1a2e1a; color: #4caf50; }
  .form-D { background: #22221a; color: #888; }
  .form-L { background: #2e1a1a; color: #ff5252; }
  .form-empty { background: #1a1a22; color: #333; }
  .standings-legend {
    display: flex; flex-wrap: wrap; gap: 20px;
    margin-top: 18px; padding-top: 14px;
    border-top: 1px solid #111118;
  }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 0.5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; }

  /* ── Results ── */
  .results-controls, .fixtures-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .matchday-select {
    background: #111118; border: 1px solid #2a2a3a;
    color: #ccc; font-family: inherit; font-size: 12px;
    padding: 6px 10px; border-radius: 4px; cursor: pointer;
  }
  .results-grid, .fixtures-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }
  .result-card, .fixture-card {
    background: #111118; border: 1px solid #1e1e2a;
    border-radius: 6px; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .result-team, .fixture-team { display: flex; align-items: center; gap: 8px; flex: 1; }
  .result-team.away, .fixture-team.away { flex-direction: row-reverse; }
  .result-team-name, .fixture-team-name { font-size: 12px; font-weight: 500; color: #ccc; }
  .result-score { font-size: 20px; font-weight: 700; color: #fff; min-width: 48px; text-align: center; letter-spacing: 1px; }
  .fixture-vs { font-size: 11px; color: #444; min-width: 24px; text-align: center; font-weight: 700; }

  /* ── Stats ── */
  .stats-table { width: 100%; border-collapse: collapse; }
  .stats-table thead tr { border-bottom: 1px solid #1e1e2a; }
  .stats-table thead th {
    padding: 6px 8px; font-size: 10px;
    text-transform: uppercase; letter-spacing: 1px;
    color: #444; font-weight: 600; text-align: center;
  }
  .stats-table thead th.col-player { text-align: left; }
  .stats-table tbody tr { border-bottom: 1px solid #0f0f18; transition: background 0.1s; }
  .stats-table tbody tr:hover { background: #13131c; }
  .stats-table tbody td { padding: 9px 8px; text-align: center; color: #888; }
  .stats-table tbody td.col-player { text-align: left; }
  .goals-cell { font-weight: 700; color: #e8c84a; font-size: 15px; }

  /* ── Empty state ── */
  .empty-state { text-align: center; padding: 60px 20px; color: #444; }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-left">
      <div class="league-icon">⚽</div>
      <div>
        <div class="league-title">Magnes Fodboldliga</div>
        <div id="league-sub" class="league-sub">Loading...</div>
      </div>
    </div>
    <button class="reset-btn" onclick="resetLeague()">↺ Reset League</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="standings" onclick="switchTab('standings')">Standings</div>
    <div class="tab" data-tab="results" onclick="switchTab('results')">Results</div>
    <div class="tab" data-tab="fixtures" onclick="switchTab('fixtures')">Fixtures</div>
    <div class="tab" data-tab="stats" onclick="switchTab('stats')">Stats</div>
  </div>

  <div id="tab-standings" class="tab-content active"></div>
  <div id="tab-results" class="tab-content"></div>
  <div id="tab-fixtures" class="tab-content"></div>
  <div id="tab-stats" class="tab-content"></div>
</div>

<script>
let state = {};
let activeTab = 'standings';

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function loadTeams() {
  const res = await fetch('./teams.json');
  const teams = await res.json();
  return teams.map(t => ({
    id: t.id,
    name: t.name,
    logoFile: `${t.id}.png`,
    strength: Math.floor(Math.random() * 10) + 1,
    played: 0, won: 0, drawn: 0, lost: 0,
    gf: 0, ga: 0, points: 0
  }));
}

function generateFixtures(teams) {
  const ids = teams.map(t => t.id);
  const n = ids.length; // 20
  const rotate = ids.slice(1); // ids[0] is the fixed pivot
  const firstHalf = [];

  for (let round = 0; round < n - 1; round++) {
    const circle = [ids[0], ...rotate];
    for (let i = 0; i < n / 2; i++) {
      firstHalf.push({
        matchday: round + 1,
        homeId: circle[i],
        awayId: circle[n - 1 - i]
      });
    }
    rotate.unshift(rotate.pop()); // rotate right
  }

  const secondHalf = firstHalf.map(f => ({
    matchday: f.matchday + (n - 1),
    homeId: f.awayId,
    awayId: f.homeId
  }));

  return [...firstHalf, ...secondHalf];
}

function generateScorers(teams) {
  const initials = 'ABCDEFGHJKLMNOPRSTV'.split('');
  const surnames = [
    'Hansen', 'Nielsen', 'Jensen', 'Pedersen', 'Andersen',
    'Christensen', 'Larsen', 'Sørensen', 'Rasmussen', 'Petersen',
    'Jørgensen', 'Madsen', 'Kristensen', 'Olsen', 'Thomsen',
    'Poulsen', 'Johansen', 'Berg', 'Møller', 'Kjær'
  ];
  const scorers = [];
  for (const team of teams) {
    const count = 2 + Math.floor(Math.random() * 2); // 2 or 3 per team
    for (let i = 0; i < count; i++) {
      const initial = initials[Math.floor(Math.random() * initials.length)];
      const surname = surnames[Math.floor(Math.random() * surnames.length)];
      scorers.push({ name: `${initial}. ${surname}`, teamId: team.id, goals: 0 });
    }
  }
  return scorers;
}

async function saveState() {
  try {
    const res = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state)
    });
    if (!res.ok) console.error('Save failed:', res.status);
  } catch (err) {
    console.error('Save failed:', err);
  }
}

async function init() {
  const res = await fetch('/save');
  if (res.ok) {
    state = await res.json();
  } else {
    const teams = await loadTeams();
    state = {
      teams,
      fixtures: generateFixtures(teams),
      results: [],
      scorers: generateScorers(teams),
      currentMatchday: 0
    };
    await saveState();
  }
  render();
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(el =>
    el.classList.toggle('active', el.dataset.tab === tab)
  );
  document.querySelectorAll('.tab-content').forEach(el =>
    el.classList.toggle('active', el.id === `tab-${tab}`)
  );
  render();
}

function render() {
  document.getElementById('league-sub').textContent =
    state.currentMatchday > 0
      ? `Season 1 · Matchday ${state.currentMatchday} of 38`
      : 'Season 1 · Pre-season';
  if (activeTab === 'standings') renderStandings();
  else if (activeTab === 'fixtures') renderFixtures();
  else if (activeTab === 'results') renderResults();
  else if (activeTab === 'stats') renderStats();
}

function getZone(rank) {
  if (rank <= 4) return 'cl';
  if (rank <= 6) return 'el';
  if (rank >= 18) return 'rel';
  return 'none';
}

function getForm(teamId) {
  return state.results
    .filter(r => r.homeId === teamId || r.awayId === teamId)
    .sort((a, b) => b.matchday - a.matchday)
    .slice(0, 5)
    .map(r => {
      const isHome = r.homeId === teamId;
      const scored = isHome ? r.homeGoals : r.awayGoals;
      const conceded = isHome ? r.awayGoals : r.homeGoals;
      if (scored > conceded) return 'W';
      if (scored < conceded) return 'L';
      return 'D';
    })
    .reverse();
}

function renderFormBadges(teamId) {
  const form = getForm(teamId);
  let html = '';
  for (let i = 0; i < 5; i++) {
    const r = form[i];
    html += r
      ? `<span class="form-badge form-${r}">${r}</span>`
      : `<span class="form-badge form-empty">·</span>`;
  }
  return `<div class="form-cell">${html}</div>`;
}

function renderStandings() {
  const sorted = [...state.teams].sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    const gdDiff = (b.gf - b.ga) - (a.gf - a.ga);
    if (gdDiff !== 0) return gdDiff;
    if (b.gf !== a.gf) return b.gf - a.gf;
    return a.name.localeCompare(b.name);
  });

  const rows = sorted.map((team, i) => {
    const rank = i + 1;
    const zone = getZone(rank);
    const gd = team.gf - team.ga;
    const gdStr = gd > 0 ? `+${gd}` : `${gd}`;
    const ptsClass = { cl: 'pts-cl', el: 'pts-el', rel: 'pts-rel', none: 'pts-mid' }[zone];
    return `
      <tr class="zone-${zone}">
        <td><span class="rank-badge rank-${zone}">${rank}</span></td>
        <td class="col-team">
          <div class="team-cell">
            <img class="team-logo" src="/logos/${team.logoFile}" alt="${esc(team.name)}">
            <span class="team-name">${esc(team.name)}</span>
          </div>
        </td>
        <td>${team.played}</td>
        <td>${team.won}</td>
        <td>${team.drawn}</td>
        <td>${team.lost}</td>
        <td>${team.gf}</td>
        <td>${team.ga}</td>
        <td>${gdStr}</td>
        <td>${renderFormBadges(team.id)}</td>
        <td class="${ptsClass}">${team.points}</td>
      </tr>`;
  }).join('');

  document.getElementById('tab-standings').innerHTML = `
    <div class="section-label">
      ${state.currentMatchday > 0 ? `Matchday ${state.currentMatchday} of 38` : 'Pre-season'}
    </div>
    <table class="standings-table">
      <thead>
        <tr>
          <th style="width:32px;">#</th>
          <th class="col-team">Team</th>
          <th>P</th><th>W</th><th>D</th><th>L</th>
          <th>GF</th><th>GA</th><th>GD</th>
          <th>Form</th>
          <th>Pts</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="standings-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#4caf50"></div>Champions League (1–4)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#4a8fff"></div>Europa League (5–6)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff5252"></div>Relegation (18–20)</div>
    </div>`;
}

function renderStats() {
  const sorted = [...state.scorers].sort((a, b) => b.goals - a.goals);
  const rows = sorted.map((scorer, i) => {
    const team = state.teams.find(t => t.id === scorer.teamId) ?? { logoFile: '', name: 'Unknown' };
    return `
      <tr>
        <td>${i + 1}</td>
        <td class="col-player">${esc(scorer.name)}</td>
        <td class="col-player">
          <div class="team-cell">
            <img class="team-logo" src="/logos/${team.logoFile}" alt="${esc(team.name)}">
            <span style="color:#888;font-size:12px;">${esc(team.name)}</span>
          </div>
        </td>
        <td class="goals-cell">${scorer.goals}</td>
      </tr>`;
  }).join('');

  document.getElementById('tab-stats').innerHTML = `
    <div class="section-label">Top Scorers</div>
    <table class="stats-table">
      <thead>
        <tr>
          <th style="width:32px;">#</th>
          <th class="col-player">Player</th>
          <th class="col-player">Club</th>
          <th>Goals</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderResults() {
  if (state.results.length === 0) {
    document.getElementById('tab-results').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <p>No results yet. Simulate a matchday to see results here.</p>
      </div>`;
    return;
  }

  const matchdays = [...new Set(state.results.map(r => r.matchday))].sort((a, b) => b - a);
  const latest = matchdays[0];

  function buildResultsHTML(matchday) {
    const matches = state.results.filter(r => r.matchday === matchday);
    return `<div class="results-grid">${matches.map(r => {
      const home = state.teams.find(t => t.id === r.homeId) ?? { logoFile: '', name: 'Unknown' };
      const away = state.teams.find(t => t.id === r.awayId) ?? { logoFile: '', name: 'Unknown' };
      return `
        <div class="result-card">
          <div class="result-team">
            <img class="team-logo" src="/logos/${home.logoFile}" alt="${esc(home.name)}">
            <span class="result-team-name">${esc(home.name)}</span>
          </div>
          <span class="result-score">${r.homeGoals}–${r.awayGoals}</span>
          <div class="result-team away">
            <img class="team-logo" src="/logos/${away.logoFile}" alt="${esc(away.name)}">
            <span class="result-team-name">${esc(away.name)}</span>
          </div>
        </div>`;
    }).join('')}</div>`;
  }

  const options = matchdays.map(md =>
    `<option value="${md}" ${md === latest ? 'selected' : ''}>Matchday ${md}</option>`
  ).join('');

  document.getElementById('tab-results').innerHTML = `
    <div class="results-controls">
      <div class="section-label" style="margin:0">Matchday</div>
      <select class="matchday-select" id="results-select" onchange="updateResultsMatchday(this.value)">
        ${options}
      </select>
    </div>
    <div id="results-content">${buildResultsHTML(latest)}</div>`;

  window.updateResultsMatchday = md => {
    document.getElementById('results-content').innerHTML = buildResultsHTML(Number(md));
  };
}

function renderFixtures() {
  const allMatchdays = [...new Set(state.fixtures.map(f => f.matchday))].sort((a, b) => a - b);
  const nextUnplayed = allMatchdays.find(md => md > state.currentMatchday) ?? allMatchdays[allMatchdays.length - 1];

  function buildMatchdayHTML(matchday) {
    const matches = state.fixtures.filter(f => f.matchday === matchday);
    const isPast = matchday <= state.currentMatchday;
    return `<div class="fixtures-grid">${matches.map(f => {
      const home = state.teams.find(t => t.id === f.homeId) ?? { logoFile: '', name: 'Unknown' };
      const away = state.teams.find(t => t.id === f.awayId) ?? { logoFile: '', name: 'Unknown' };
      return `
        <div class="fixture-card" style="${isPast ? 'opacity:0.45;' : ''}">
          <div class="fixture-team">
            <img class="team-logo" src="/logos/${home.logoFile}" alt="${esc(home.name)}">
            <span class="fixture-team-name">${esc(home.name)}</span>
          </div>
          <span class="fixture-vs">vs</span>
          <div class="fixture-team away">
            <img class="team-logo" src="/logos/${away.logoFile}" alt="${esc(away.name)}">
            <span class="fixture-team-name">${esc(away.name)}</span>
          </div>
        </div>`;
    }).join('')}</div>`;
  }

  const options = allMatchdays.map(md =>
    `<option value="${md}" ${md === nextUnplayed ? 'selected' : ''}>Matchday ${md}</option>`
  ).join('');

  document.getElementById('tab-fixtures').innerHTML = `
    <div class="fixtures-controls">
      <div class="section-label" style="margin:0">Matchday</div>
      <select class="matchday-select" id="fixture-select" onchange="updateFixtureMatchday(this.value)">
        ${options}
      </select>
    </div>
    <div id="fixture-content">${buildMatchdayHTML(nextUnplayed)}</div>`;

  window.updateFixtureMatchday = md => {
    document.getElementById('fixture-content').innerHTML = buildMatchdayHTML(Number(md));
  };
}

async function resetLeague() {
  if (!confirm('Reset the league? All progress will be cleared.')) return;
  try {
    const teams = await loadTeams();
    state = {
      teams,
      fixtures: generateFixtures(teams),
      results: [],
      scorers: generateScorers(teams),
      currentMatchday: 0
    };
    await saveState();
    render();
  } catch (err) {
    console.error('Reset failed:', err);
    alert('Reset failed. Is the server running?');
  }
}

document.addEventListener('DOMContentLoaded', () =>
  init().catch(err => {
    document.getElementById('league-sub').textContent = 'Failed to load';
    console.error('Init failed:', err);
  })
);
</script>
</body>
</html>
